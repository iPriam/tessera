[binaries]
c = '/root/.kira/toolchains/llvm/23.1.0/x86_64-linux-gnu/bin/clang'
cpp = '/root/.kira/toolchains/llvm/23.1.0/x86_64-linux-gnu/bin/clang++'
ar = '/root/.kira/toolchains/llvm/23.1.0/x86_64-linux-gnu/bin/llvm-ar'
strip = '/root/.kira/toolchains/llvm/23.1.0/x86_64-linux-gnu/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[properties]
sys_root = '/root/Dev/webkit-sysroot/aarch64'
pkg_config_libdir = ['/root/Dev/webkit-sysroot/aarch64/usr/lib/aarch64-linux-gnu/pkgconfig', '/root/Dev/webkit-sysroot/aarch64/usr/share/pkgconfig']
needs_exe_wrapper = true

[built-in options]
c_args = ['--target=aarch64-linux-gnu', '--sysroot=/root/Dev/webkit-sysroot/aarch64']
cpp_args = ['--target=aarch64-linux-gnu', '--sysroot=/root/Dev/webkit-sysroot/aarch64']
c_link_args = ['--target=aarch64-linux-gnu', '--sysroot=/root/Dev/webkit-sysroot/aarch64', '-fuse-ld=lld', '-Wl,-z,max-page-size=65536']
cpp_link_args = ['--target=aarch64-linux-gnu', '--sysroot=/root/Dev/webkit-sysroot/aarch64', '-fuse-ld=lld', '-Wl,-z,max-page-size=65536']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
